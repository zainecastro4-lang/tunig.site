<main id="main-content" role="main">
    <h1>Upload Portfolio Sample</h1>
    <p id="admin-welcome" role="status" aria-live="polite"></p>

    <form id="upload-form" enctype="multipart/form-data" novalidate>
        <div class="form-group">
            <label for="up-title">Sample Title</label>
            <input type="text" id="up-title" required>
        </div>
        <div class="form-group">
            <label for="up-category">Category</label>
            <select id="up-category" required>
                <option>Podcast Editing</option>
                <option>Voice &amp; Narration Editing</option>
                <option>Mixing &amp; Mastering</option>
                <option>Music &amp; Sound Design</option>
                <option>Jingles &amp; Audio Branding</option>
            </select>
        </div>
        <div class="form-group">
            <label for="up-type">Media Type</label>
            <select id="up-type" required>
                <option value="audio">Audio</option>
                <option value="video">Video</option>
            </select>
        </div>
        <div class="form-group">
            <label for="up-desc">Description</label>
            <textarea id="up-desc"></textarea>
        </div>
        <div class="form-group">
            <label for="up-file">Audio or Video File</label>
            <input type="file" id="up-file" name="media" accept="audio/*,video/*" required>
        </div>
        <p><button type="submit" class="btn">Upload Sample</button></p>
        <p id="upload-status" role="status" aria-live="polite"></p>
    </form>
</main>
