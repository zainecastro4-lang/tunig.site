<main id="main-content" role="main">
    <h1>Before &amp; After</h1>

    <section aria-labelledby="up-h">
        <h2 id="up-h">Upload a Pair</h2>
        <form id="ba-form" enctype="multipart/form-data" novalidate>
            <div class="form-group">
                <label for="ba-title">Title</label>
                <input type="text" id="ba-title" required placeholder="e.g. Podcast Episode 01">
            </div>
            <div class="form-group">
                <label for="ba-desc">Description / Processing Performed</label>
                <textarea id="ba-desc"></textarea>
            </div>

            <fieldset style="border:1px solid var(--line);padding:1rem;border-radius:6px;margin-bottom:1rem">
                <legend><strong>Before</strong></legend>
                <div class="form-group">
                    <label for="ba-before-type">Before Media Type</label>
                    <select id="ba-before-type">
                        <option value="audio">Audio</option>
                        <option value="video">Video</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ba-before-file">Before File</label>
                    <input type="file" id="ba-before-file" accept="audio/*,video/*" required>
                </div>
            </fieldset>

            <fieldset style="border:1px solid var(--line);padding:1rem;border-radius:6px;margin-bottom:1rem">
                <legend><strong>After</strong></legend>
                <div class="form-group">
                    <label for="ba-after-type">After Media Type</label>
                    <select id="ba-after-type">
                        <option value="audio">Audio</option>
                        <option value="video">Video</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ba-after-file">After File</label>
                    <input type="file" id="ba-after-file" accept="audio/*,video/*" required>
                </div>
            </fieldset>

            <p><button type="submit" class="btn">Upload Pair</button></p>
            <p id="ba-status" role="status" aria-live="polite"></p>
        </form>
    </section>

    <section aria-labelledby="list-h">
        <h2 id="list-h">Uploaded Pairs</h2>
        <div id="admin-ba" role="region" aria-live="polite"><p>Loading…</p></div>
    </section>
</main>

<footer role="contentinfo"><p class="copyright">© Tunog Modern PH-Worldwide.</p></footer>

</html>
